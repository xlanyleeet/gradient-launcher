name: Build Gradient Native

on:
  workflow_dispatch:
  push:
    branches: [native/github-actions]
    tags: ['native-v*']

permissions:
  contents: read

env:
  SQLX_OFFLINE: 'true'
  CARGO_TERM_COLOR: always
  GRADIENT_DISCORD_APPLICATION_ID: ${{ vars.GRADIENT_DISCORD_APPLICATION_ID }}

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      number: ${{ steps.version.outputs.number }}
    steps:
      - id: version
        shell: bash
        run: |
          version=0.4.0
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            if [[ ! "$GITHUB_REF_NAME" =~ ^native-v(0|[1-9][0-9]{0,3})\.(0|[1-9][0-9]{0,3})\.(0|[1-9][0-9]{0,3})$ ]]; then
              echo "::error::Expected a stable tag of the form native-vMAJOR.MINOR.PATCH"
              exit 1
            fi
            version="${GITHUB_REF_NAME#native-v}"
          fi
          echo "number=$version" >> "$GITHUB_OUTPUT"

  windows:
    name: Windows x64
    runs-on: windows-2025
    needs: version
    env:
      GRADIENT_NATIVE_VERSION: ${{ needs.version.outputs.number }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64
      - name: Build Rust core
        working-directory: core
        run: cargo build --locked --release -p gradient-core
      - name: Run Rust security tests
        working-directory: core
        shell: pwsh
        run: |
          cargo test --locked -p theseus --lib token_crypto
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo test --locked -p theseus --lib minecraft_auth
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo test --locked -p gradient-core
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build WinUI
        run: MSBuild winui/Gradient.WinUI.csproj /restore /p:Platform=x64 /p:Configuration=Release "/p:Version=$env:GRADIENT_NATIVE_VERSION"
      - name: Verify output
        shell: pwsh
        run: |
          $output = 'winui/bin/x64/Release/net8.0-windows10.0.19041.0/win-x64'
          foreach ($path in 'Gradient.WinUI.exe', 'gradient-core.exe', 'Assets/Cover.png', 'Assets/Launcher.png', 'Assets/Launcher.ico', 'Assets/Modrinth.svg', 'InterfaceStrings.json') {
            if (!(Test-Path (Join-Path $output $path) -PathType Leaf)) {
              throw "Build output missing: $path"
            }
          }
      - name: Verify WinUI opens its main window
        shell: pwsh
        run: |
          $output = (Resolve-Path 'winui/bin/x64/Release/net8.0-windows10.0.19041.0/win-x64').Path
          $env:THESEUS_CONFIG_DIR = Join-Path $env:RUNNER_TEMP 'gradient-winui-smoke'
          $launcher = Start-Process -FilePath (Join-Path $output 'Gradient.WinUI.exe') -WorkingDirectory $output -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(25)
            do {
              $launcher.Refresh()
              if ($launcher.HasExited) { throw "WinUI exited during startup ($($launcher.ExitCode))." }
              if ($launcher.MainWindowHandle -ne 0 -and $launcher.MainWindowTitle -eq 'Gradient Launcher') { break }
              Start-Sleep -Milliseconds 250
            } while ((Get-Date) -lt $deadline)
            if ($launcher.MainWindowTitle -ne 'Gradient Launcher') { throw 'WinUI did not open its main window.' }
          } catch {
            $log = Join-Path $env:LOCALAPPDATA 'GradientNative/winui-error.log'
            if (Test-Path $log) { Get-Content $log }
            throw
          } finally {
            if (!$launcher.HasExited) {
              if (!$launcher.CloseMainWindow() -or !$launcher.WaitForExit(5000)) { $launcher.Kill() }
            }
          }
      - uses: actions/upload-artifact@v6
        if: github.ref_type != 'tag'
        with:
          name: gradient-native-windows-x64
          path: winui/bin/x64/Release/net8.0-windows10.0.19041.0/win-x64/
          if-no-files-found: error
      - name: Archive Windows release
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $output = 'winui/bin/x64/Release/net8.0-windows10.0.19041.0/win-x64'
          tar.exe -a -cf gradient-native-windows-x64.zip -C $output .
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v6
        if: github.ref_type == 'tag'
        with:
          name: gradient-native-release-windows-x64
          path: gradient-native-windows-x64.zip
          if-no-files-found: error
      - name: Sign binaries and package the Velopack installer
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $output = 'winui/bin/x64/Release/net8.0-windows10.0.19041.0/win-x64'
          $pfx = Join-Path $env:RUNNER_TEMP 'windows-signing.pfx'
          $hasCert = ![string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_BASE64) -and ![string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)
          try {
            if ($hasCert) {
              [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
              $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue |
                Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
              if (!$signtool) { throw 'signtool.exe was not found on the runner.' }
              foreach ($bin in 'Gradient.WinUI.exe', 'gradient-core.exe') {
                & $signtool sign /f $pfx /p $env:WINDOWS_CERTIFICATE_PASSWORD /fd sha256 /tr http://timestamp.digicert.com /td sha256 (Join-Path $output $bin)
                if ($LASTEXITCODE) { exit $LASTEXITCODE }
              }
            } else {
              Write-Host '::notice::Windows Authenticode secrets are not configured; building unsigned binaries and installer.'
            }
            dotnet tool install vpk --tool-path "$env:RUNNER_TEMP/vpk" --version 1.2.161
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            $vpkArgs = @(
              'pack',
              '--packId', 'GradientNative',
              '--packVersion', $env:GRADIENT_NATIVE_VERSION,
              '--packDir', $output,
              '--mainExe', 'Gradient.WinUI.exe',
              '--packTitle', 'Gradient Launcher',
              '--icon', 'winui/Assets/Launcher.ico',
              '--channel', 'win-x64',
              '--runtime', 'win-x64',
              '--framework', 'net8-x64-desktop',
              '--outputDir', 'velopack'
            )
            if ($hasCert) {
              $vpkArgs += @('--signParams', "/f `"$pfx`" /p `"$env:WINDOWS_CERTIFICATE_PASSWORD`" /fd sha256 /tr http://timestamp.digicert.com /td sha256")
            }
            & "$env:RUNNER_TEMP/vpk/vpk.exe" @vpkArgs
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            foreach ($pattern in 'releases.win-x64.json', '*-full.nupkg', '*-Setup.exe') {
              if (!(Get-ChildItem -Path velopack -Filter $pattern -File)) { throw "Missing Velopack output: $pattern" }
            }
          } finally {
            if (Test-Path $pfx) { Remove-Item -Force $pfx }
          }
      - uses: actions/upload-artifact@v6
        with:
          name: gradient-native-velopack
          path: |
            velopack/releases.win-x64.json
            velopack/*-full.nupkg
            velopack/*-Setup.exe
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    needs: version
    env:
      GRADIENT_NATIVE_VERSION: ${{ needs.version.outputs.number }}
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Apple Silicon
            runner: macos-15
            arch: arm64
          - platform: Intel
            runner: macos-15-intel
            arch: x86_64
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify Xcode and macOS SDK
        run: |
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
      - name: Build SwiftUI
        working-directory: swiftui
        run: swift build -c release
      - name: Build Rust core
        working-directory: core
        run: cargo build --locked --release -p gradient-core
      - name: Run Rust security tests
        working-directory: core
        shell: pwsh
        run: |
          cargo test --locked -p theseus --lib token_crypto
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo test --locked -p theseus --lib minecraft_auth
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo test --locked -p gradient-core
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Package macOS drag-and-drop installer
        shell: bash
        env:
          MACOS_ARCH: ${{ matrix.arch }}
          SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_NOTARY_KEY_BASE64: ${{ secrets.MACOS_NOTARY_KEY_BASE64 }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER: ${{ secrets.MACOS_NOTARY_ISSUER }}
        run: |
          output="$(swift build --package-path swiftui -c release --show-bin-path)"
          build_info="$(xcrun vtool -show-build "$output/Gradient")"
          printf '%s\n' "$build_info"
          printf '%s\n' "$build_info" | awk '
            $1 == "sdk" && $2 ~ /^26\./ { sdk = 1 }
            $1 == "minos" && $2 == "15.0" { minimum = 1 }
            END { exit !(sdk && minimum) }'
          for binary in "$output/Gradient" core/target/release/gradient-core; do
            actual="$(lipo -archs "$binary")"
            printf '%s: %s\n' "$binary" "$actual"
            if [[ "$actual" != "$MACOS_ARCH" ]]; then
              echo "::error::Expected $MACOS_ARCH, got $actual in $binary"
              exit 1
            fi
          done
          stage="$RUNNER_TEMP/gradient-native-macos"
          app="$stage/Gradient Launcher.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources" "$app/Contents/Frameworks"
          cp swiftui/Info.plist "$app/Contents/Info.plist"
          plutil -replace CFBundleShortVersionString -string "$GRADIENT_NATIVE_VERSION" "$app/Contents/Info.plist"
          plutil -replace CFBundleVersion -string "$GRADIENT_NATIVE_VERSION" "$app/Contents/Info.plist"
          plutil -lint "$app/Contents/Info.plist"
          cp "$output/Gradient" core/target/release/gradient-core "$app/Contents/MacOS/"
          cp swiftui/Sources/Gradient/Resources/{Cover.png,InterfaceStrings.json,PlayerHead.png} "$app/Contents/Resources/"
          cp swiftui/Launcher.icns "$app/Contents/Resources/"
          framework="$(find swiftui/.build/artifacts -type d -path '*/macos-*/Sparkle.framework' -print -quit)"
          test -d "$framework"
          ditto "$framework" "$app/Contents/Frameworks/Sparkle.framework"
          otool -L "$app/Contents/MacOS/Gradient" | grep -F '@rpath/Sparkle.framework/'
          if [[ "$GITHUB_REF_TYPE" == tag && -n "$SPARKLE_PUBLIC_KEY" ]]; then
            bash .github/scripts/package-sparkle.sh "$app" "$MACOS_ARCH" true
          elif [[ -n "$MACOS_CERTIFICATE_BASE64" ]]; then
            bash .github/scripts/package-sparkle.sh "$app" "$MACOS_ARCH"
          else
            echo "::notice::Using a local ad hoc signature. Gatekeeper trust for downloads requires Developer ID and notarization."
            bash .github/scripts/sign-macos-app.sh "$app" --sign - --timestamp=none
            bash .github/scripts/package-macos-dmg.sh "$app" "$MACOS_ARCH"
          fi
      - uses: actions/upload-artifact@v6
        with:
          name: gradient-native-macos-${{ matrix.arch }}
          path: |
            gradient-native-macos-${{ matrix.arch }}.dmg
            appcast-macos-${{ matrix.arch }}.xml
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: github.ref_type == 'tag'
    needs: [windows, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: native-release-${{ github.ref }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: gradient-native-*
          path: downloads
      - name: Publish all three packages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
        run: |
          tag="$GITHUB_REF_NAME"
          assets=(
            downloads/gradient-native-release-windows-x64/gradient-native-windows-x64.zip
            downloads/gradient-native-macos-arm64/gradient-native-macos-arm64.dmg
            downloads/gradient-native-macos-x86_64/gradient-native-macos-x86_64.dmg
          )
          for path in "${assets[@]}"; do test -s "$path"; done
          velopack=downloads/gradient-native-velopack
          assets+=("$velopack/releases.win-x64.json" "$velopack/"*-full.nupkg "$velopack/"*-Setup.exe)
          if [[ -n "$SPARKLE_PUBLIC_KEY" ]]; then
            assets+=(downloads/gradient-native-macos-arm64/appcast-macos-arm64.xml)
            assets+=(downloads/gradient-native-macos-x86_64/appcast-macos-x86_64.xml)
          fi
          for path in "${assets[@]}"; do test -s "$path"; done
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' > release-status; then
            if [[ "$(cat release-status)" == false ]]; then
              echo "::error::Release $tag is already published. Use a new version to replace its packages."
              exit 1
            fi
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --generate-notes --title "Gradient Native ${tag#native-v}"
          fi
          gh release upload "$tag" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest

name: Build Gradient Native

on:
  workflow_dispatch:
  push:
    branches: [native/github-actions]

permissions:
  contents: read

env:
  SQLX_OFFLINE: 'true'
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows x64
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64
      - name: Build Rust core
        working-directory: core
        run: cargo build --locked --release -p gradient-core
      - name: Build WinUI
        run: MSBuild winui/Gradient.WinUI.csproj /restore /p:Platform=x64 /p:Configuration=Release
      - name: Verify output
        shell: pwsh
        run: |
          $output = 'winui/bin/x64/Release/net8.0-windows10.0.19041.0/win-x64'
          foreach ($path in 'Gradient.WinUI.exe', 'gradient-core.exe', 'Assets/Cover.png') {
            if (!(Test-Path (Join-Path $output $path) -PathType Leaf)) {
              throw "Build output missing: $path"
            }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: gradient-native-windows-x64
          path: winui/bin/x64/Release/net8.0-windows10.0.19041.0/win-x64/
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Apple Silicon
            runner: macos-15
            arch: arm64
          - platform: Intel
            runner: macos-15-intel
            arch: x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build Rust core
        working-directory: core
        run: cargo build --locked --release -p gradient-core
      - name: Build SwiftUI
        working-directory: swiftui
        run: swift build -c release
      - name: Archive macOS preview
        shell: bash
        env:
          MACOS_ARCH: ${{ matrix.arch }}
        run: |
          output="$(swift build --package-path swiftui -c release --show-bin-path)"
          for binary in "$output/Gradient" core/target/release/gradient-core; do
            actual="$(lipo -archs "$binary")"
            printf '%s: %s\n' "$binary" "$actual"
            if [[ "$actual" != "$MACOS_ARCH" ]]; then
              echo "::error::Expected $MACOS_ARCH, got $actual in $binary"
              exit 1
            fi
          done
          stage="$RUNNER_TEMP/gradient-native-macos"
          app="$stage/Gradient Launcher.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp swiftui/Info.plist "$app/Contents/Info.plist"
          plutil -lint "$app/Contents/Info.plist"
          cp "$output/Gradient" core/target/release/gradient-core "$app/Contents/MacOS/"
          cp swiftui/Sources/Gradient/Resources/Cover.png "$app/Contents/Resources/"
          tar -czf "gradient-native-macos-$MACOS_ARCH.tar.gz" -C "$stage" "Gradient Launcher.app"
      - uses: actions/upload-artifact@v4
        with:
          name: gradient-native-macos-${{ matrix.arch }}
          path: gradient-native-macos-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
